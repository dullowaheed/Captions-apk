
name: Build Urdu Caption Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q UrduCaptionStudio_Android_Source.zip -d .

      - name: Build APK
        run: gradle -p UrduCaptionStudio :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduCaptionStudio-debug-apk
          path: UrduCaptionStudio/app/build/outputs/apk/debug/app-debug.apk
          
